version: "3.9"

# Stack local para validar los bounded contexts Clientes y Catalogo Geografico end-to-end.
# Cada servicio tiene su propia base de datos (un esquema por microservicio, sin acoplamiento
# a nivel de datos). geo-catalog-service no requiere RabbitMQ: es un servicio de referencia
# de solo lectura, sin eventos de dominio que publicar.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: customer_service
    ports:
      - "${CUSTOMER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_service -d customer_service"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-geo:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geo_catalog_service
      POSTGRES_USER: geo_catalog_service
      POSTGRES_PASSWORD: geo_catalog_service
    ports:
      - "${GEO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-geo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_catalog_service -d geo_catalog_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_service
      SPRING_DATASOURCE_USERNAME: customer_service
      SPRING_DATASOURCE_PASSWORD: customer_service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      # Nota de binding relajado de Spring Boot: para la propiedad kebab-case
      # "geo-catalog-service.base-url" (prefijo con guiones + atributo con guion),
      # la variable de entorno equivalente colapsa los guiones dentro de cada
      # segmento y usa "_" solo como separador de punto: GEOCATALOGSERVICE_BASEURL.
      # Un env var como GEO_CATALOG_SERVICE_BASE_URL NO se enlaza a esta propiedad.
      GEOCATALOGSERVICE_BASEURL: http://geo-catalog-service:8082
      TZ: America/Santiago
    ports:
      - "${CUSTOMER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      geo-catalog-service:
        condition: service_healthy

  geo-catalog-service:
    build:
      context: ..
      dockerfile: services/geo-catalog-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-geo:5432/geo_catalog_service
      SPRING_DATASOURCE_USERNAME: geo_catalog_service
      SPRING_DATASOURCE_PASSWORD: geo_catalog_service
      TZ: America/Santiago
    ports:
      - "${GEO_CATALOG_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres-geo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - customer-service
      - geo-catalog-service

volumes:
  postgres-data:
  postgres-geo-data:
