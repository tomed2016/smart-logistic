# Reverse proxy para el frontend Angular:
# - Sirve los estáticos compilados (SPA con enrutamiento del lado del cliente).
# - Enruta /api/v1/clientes/** hacia customer-service (bounded context Clientes).
# - Enruta el resto de /api/v1/** (regiones, provincias, comunas, feriados,
#   dias-habiles) hacia geo-catalog-service.
# Esto evita CORS y evita exponer los servicios backend directamente al navegador,
# tal como se documenta en environment.production.ts del frontend.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver DNS embebido de Docker: permite que nginx resuelva los nombres de
  # servicio de docker-compose (customer-service, geo-catalog-service) de forma
  # perezosa (en cada request), en vez de al iniciar. Sin esto, nginx falla al
  # arrancar si el contenedor upstream aún no tiene una entrada DNS (por ejemplo,
  # si el contenedor del frontend arranca antes que el backend, o si se ejecuta
  # el contenedor de forma aislada, fuera de la red de compose).
  resolver 127.0.0.11 valid=30s;

  location ~ ^/api/v1/clientes(/|$) {
    set $upstream_customer http://customer-service:9081;
    proxy_pass $upstream_customer;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/ {
    set $upstream_geo http://geo-catalog-service:9082;
    proxy_pass $upstream_geo;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
