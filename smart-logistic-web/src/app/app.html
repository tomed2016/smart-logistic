<mat-toolbar color="primary" class="toolbar">
  <span class="toolbar__marca">{{ titulo }}</span>
  <span class="toolbar__spacer"></span>
  <span class="toolbar__subtitulo">Gestión logística y administrativa</span>
</mat-toolbar>

<mat-sidenav-container class="contenedor">
  <mat-sidenav mode="side" opened class="menu">
    <mat-nav-list>
      <a mat-list-item routerLink="/clientes" routerLinkActive="activo">
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>Clientes</span>
      </a>
      <a mat-list-item routerLink="/catalogo-geografico" routerLinkActive="activo">
        <mat-icon matListItemIcon>map</mat-icon>
        <span matListItemTitle>Catálogo geográfico</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="contenido">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
