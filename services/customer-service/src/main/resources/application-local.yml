spring:
  datasource:
    url: jdbc:h2:mem:customer_service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

smart-logistic:
  outbox:
    enabled: false

# Disable Rabbit auto-configuration for local in-memory runs (no RabbitMQ required)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

server:
  port: 8081

logging:
  level:
    cl.smartlogistic: INFO

# Disable Rabbit health check in local profile (no Rabbit broker)
management:
  health:
    rabbit:
      enabled: false
