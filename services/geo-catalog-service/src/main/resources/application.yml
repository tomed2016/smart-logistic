spring:
  application:
    name: geo-catalog-service
  datasource:
    # When running the local infra with docker-compose the geo postgres is
    # published on host port 5433 (see infra/docker-compose.yml). Use 5433
    # as the default for local development so the service can connect to the
    # database started by docker-compose without changing environment vars.
    url: jdbc:postgresql://localhost:5433/geo_catalog_service
    username: geo_catalog_service
    password: geo_catalog_service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 9082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    cl.smartlogistic: INFO
